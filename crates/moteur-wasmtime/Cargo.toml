[package]
name = "moteur-wasmtime"
description = "Le module réécrit dans wasmtime, comme partie::Instance : les primitives de wasmtime sous le protocole du commun."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
jeu-abi.workspace = true
# Le protocole d'un appel, l'instantané et l'empreinte : ce moteur n'en fournit que les
# primitives (PHASE-3, § 2.3).
moteur-commun.workspace = true
partie.workspace = true
reecriture.workspace = true
# Le moteur natif de la phase 1 : Cranelift, sans fils, SIMD, GC ni exceptions (§ 8.7).
wasmtime = { workspace = true, features = ["cranelift", "runtime", "std"] }

[dev-dependencies]
# Les modules fautifs écrits à la main : import, boucle, récursion, pile non rendue (§ 8.7).
wat.workspace = true

[lints]
workspace = true
