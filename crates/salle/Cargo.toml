[package]
name = "salle"
description = "La salle, sans entrées-sorties : le chiffrement entre l'autorité et les appareils, et leurs messages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# Les trames en clair que le relais voit : la classe d'une trame, une case, le code de
# salle, `TRAME_MAX` (PHASE-3, § 2.7).
liaison.workspace = true
# La partie qui fait foi, que l'autorité tient, et la forme de ce que la garde écrit
# (PHASE-3, § 2.4, lot 4b).
partie.workspace = true
# Le format et son décodage strict ; les types du fil que les messages portent (`Pas`,
# `Instant`, `Capacites`).
jeu-abi.workspace = true
# La dérivation des messages chiffrés.
serde.workspace = true
# Noise NKpsk0, la poignée de main entre un appareil et l'autorité (§ 2.6, P12).
snow.workspace = true
# Les trames de transport et les cases de la garde (§ 2.4, § 2.6).
chacha20poly1305.workspace = true
# Le scellement d'une case de point par tranches, sur plusieurs réveils du Worker
# (lot 10a) : les primitives de XChaCha20-Poly1305, les mêmes octets.
chacha20.workspace = true
poly1305.workspace = true
# La psk tirée du secret d'entrée, la preuve d'autorité, la clé des cases de la garde,
# l'empreinte d'une case (§ 2.6, § 2.7).
blake3.workspace = true

[dev-dependencies]
# Des octets au hasard pour les décodeurs et le déchiffrement : jamais de panique
# (REM-64) ; la fenêtre de rejeu contre un modèle.
proptest.workspace = true
# Les soirées en mémoire sur un vrai module, réécrit et chargé dans wasmtime : `devine`
# dans les tests, les trois jeux par l'exemple `soiree_en_memoire` (PHASE-3, § 8.1,
# lot 4b). En développement seulement : `salle` ne tire jamais de moteur.
moteur-wasmtime.workspace = true

[lints]
workspace = true
