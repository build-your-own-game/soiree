[package]
name = "banc"
description = "Le banc des navigateurs, et le binaire soiree-banc : pilotes, pages de test, scénarios."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "soiree-banc"
path = "src/bin/soiree-banc.rs"

[dependencies]
# E20 : relire le relevé de wasmtime (ses événements, ses appels, son empreinte) pour
# juger ce qu'une page rapporte sans la croire sur parole.
moteur-commun.workspace = true
# Les pilotes de Chrome et de Firefox : CDP et WebDriver BiDi sont des WebSocket.
tungstenite.workspace = true
# Les messages de CDP et de BiDi, et le rapport qu'une page envoie à `POST /banc/rapport`.
serde_json.workspace = true
# La règle « mêmes lints » : les manifestes, `clippy.toml` et `rust-toolchain.toml` de
# `web/`, comparés à ceux du commun.
toml.workspace = true

[dev-dependencies]
# La référence des pièges des essais de `Machine` : wasmtime, le moteur de l'épreuve,
# avec les fonctionnalités que `moteur-wasmtime` et `epreuve` lui donnent déjà.
wasmtime = { workspace = true, features = ["cranelift", "runtime", "std"] }
# Le module des essais, écrit en `wat`.
wat.workspace = true
# La sorte d'un appel, pour écrire la trace d'une capture d'essai (`etalonner::tests`).
jeu-abi.workspace = true

[lints]
workspace = true
