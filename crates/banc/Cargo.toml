[package]
name = "banc"
description = "Le banc des navigateurs, et le binaire soiree-banc : pilotes, pages de test, scénarios."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "soiree-banc"
path = "src/bin/soiree-banc.rs"

[dependencies]
# E20 : relire le relevé de wasmtime (ses événements, ses appels, son empreinte) pour
# juger ce qu'une page rapporte sans la croire sur parole.
moteur-commun.workspace = true
# `soiree-native` (lot 5) : l'autorité et les téléphones natifs, et les jugements de la
# soirée (la chaîne écrite, les accusés, la reprise depuis la garde).
salle.workspace = true
# Les trames en clair que les bouts natifs échangent avec le relais.
liaison.workspace = true
# Le relais de la soirée : lancé dans le processus pour les tests, et sa garde sur
# disque relue à la fin d'une soirée native.
relais.workspace = true
# L'autorité native joue le module du jeu dans wasmtime, comme l'épreuve ; les
# téléphones natifs partageront son `Engine` quand ils joueront la page (lot 12).
moteur-wasmtime.workspace = true
# La déclaration du jeu (ses téléphones, sa redite) et les types du fil ; aussi, en test,
# la sorte d'un appel, pour écrire la trace d'une capture d'essai (`etalonner::tests`).
jeu-abi.workspace = true
# `dessin` (lot 9) : les pires cas construits sur une instance nue, comme E16 (le trait
# `Fabrique`, les images qu'une scène cite).
partie.workspace = true
# `dessin` : l'agencement natif de chaque texte, que la télé doit dessiner au bit près,
# le style du nom d'un bouton et le texte d'un compte à rebours.
mise-en-page.workspace = true
# L'empreinte du module joué, au rapport ; celle de chaque agencement (`dessin`).
blake3.workspace = true
# Les pilotes de Chrome et de Firefox : CDP et WebDriver BiDi sont des WebSocket.
tungstenite.workspace = true
# Les messages de CDP et de BiDi, et le rapport qu'une page envoie à `POST /banc/rapport`.
serde_json.workspace = true
# La règle « mêmes lints » : les manifestes, `clippy.toml` et `rust-toolchain.toml` de
# `web/`, comparés à ceux du commun.
toml.workspace = true

[dev-dependencies]
# La référence des pièges des essais de `Machine` : wasmtime, le moteur de l'épreuve,
# avec les fonctionnalités que `moteur-wasmtime` et `epreuve` lui donnent déjà.
wasmtime = { workspace = true, features = ["cranelift", "runtime", "std"] }
# Le module des essais, écrit en `wat`.
wat.workspace = true

[lints]
workspace = true
