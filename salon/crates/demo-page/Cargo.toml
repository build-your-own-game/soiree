[package]
name = "salon-demo-page"
description = "The demo's TV and phone page"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
salon-core.workspace = true
salon-web = { path = "../web" }
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Location", "EventTarget", "Event", "Node"] }

[lints]
workspace = true
