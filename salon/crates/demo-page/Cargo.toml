[package]
name = "salon-demo-page"
description = "The demo's TV and phone page"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
salon-core.workspace = true
salon-web = { path = "../web" }
# The demo's messages and version: the same library as its host.
salon-demo = { path = "../demo" }
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "Location", "EventTarget", "Event", "Node",
  "DomTokenList", "CssStyleDeclaration",
  "HtmlDivElement", "HtmlButtonElement", "HtmlHeadingElement", "HtmlParagraphElement",
  "HtmlUListElement", "HtmlLiElement",
] }

[lints]
workspace = true
