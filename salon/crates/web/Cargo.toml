[package]
name = "salon-web"
description = "A page's shell around salon-core: WebRTC, WebSocket, token, timers"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[features]
audio-test = []

[dependencies]
salon-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Must match the installed wasm-bindgen CLI exactly (games build their pages with it).
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "AudioContext", "BaseAudioContext", "AudioDestinationNode", "AudioNode", "AudioParam",
  "AudioContextState", "OscillatorNode", "OscillatorType", "GainNode", "OfflineAudioContext", "AudioBuffer",
  "HtmlButtonElement", "HtmlInputElement", "HtmlDivElement", "Node", "PointerEvent",
  "Navigator", "HtmlElement", "KeyboardEvent", "KeyboardEventInit", "CssStyleDeclaration",
  "Window", "Document", "Element", "Node", "Location", "Storage", "Crypto", "Performance", "EventTarget", "Event",
  "MessageEvent", "WebSocket", "BinaryType", "CloseEvent",
  "RtcPeerConnection", "RtcDataChannel", "RtcDataChannelInit", "RtcDataChannelType", "RtcDataChannelState",
  "RtcSessionDescriptionInit", "RtcSdpType", "RtcPeerConnectionState", "RtcSessionDescription",
  "RtcIceConnectionState",
  "Request", "RequestInit", "Response", "Headers",
] }

[[example]]
name = "ui_probe"
crate-type = ["cdylib"]

[lints]
workspace = true

[[example]]
name = "audio_probe"
crate-type = ["cdylib"]
