[workspace]
resolver = "3"
members = ["crates/core", "crates/crypto", "crates/host", "crates/web", "crates/demo", "crates/demo-page"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"
publish = false

[workspace.dependencies]
salon-core = { path = "crates/core" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
# Property tests (CERTIFICATION.md, stage 1): random inputs, shrunk to the smallest failure.
proptest = { version = "1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Du bruit dans du code de jeu : conversions entier → flottant partout, documentation d'API publique inutile ici.
cast_precision_loss = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Chaque exception est explicite et justifiée : #[expect(lint, reason = "...")], jamais #[allow].
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Un `.expect()`, un `panic!` ou un index hors bornes arrêtent la partie autant qu'un `unwrap`.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
todo = "deny"

# Un jeu compilé en debug sans optimisation est injouable : on optimise les dépendances même en dev.
[profile.dev.package."*"]
opt-level = 3

# Un dépassement d'entier est un bug, même en release.
[profile.release]
overflow-checks = true
