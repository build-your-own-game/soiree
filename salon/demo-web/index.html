<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salon</title>
  <style>
    body { margin: 0; font: 20px -apple-system, system-ui, sans-serif; background: #12131a; color: #eee; }
    /* The TV's text stays in the safe area: the inner 90 % of the screen. */
    #app { padding: 6vh 6vw; }
    button { font-size: 40px; width: 100%; height: 50vh; border: 0; border-radius: 24px; background: #3a7; color: #fff; }
    .status { opacity: .7; margin: 8px 0 16px; }
    li { margin: 6px 0; } .away { opacity: .4; }
    /* The TV lists up to 15 players in three columns, inside the safe area. */
    .tv ul { columns: 3; font-size: 2.6vh; padding: 0; list-style: none; }
    .tv svg { width: 30vh; height: 30vh; }
    svg { width: 220px; height: 220px; background: #fff; padding: 8px; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import init from "/pkg/salon_demo_page.js";
    await init();
  </script>
</body>
</html>
