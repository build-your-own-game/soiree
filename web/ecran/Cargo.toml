[package]
name = "ecran"
description = "La page de la télé : elle reçoit la scène du Worker et la dessine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

# Une bibliothèque WebAssembly que `wasm-bindgen` relie à la page de la télé
# (`web/demarrage.js`, lot 10a), et une bibliothèque Rust pour l'exemple du banc et les
# tests natifs.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Le dessin de la scène.
rendu.workspace = true
# Les messages du Worker à la page (`salle::ecran`), une définition pour les deux côtés.
salle.workspace = true
# La scène, la forme de l'écran, les clés.
jeu-abi.workspace = true
# Le refus du relais qu'un message du Worker porte (« Remplacée », P36).
liaison.workspace = true
# Les polices de la télé, validées comme E1 les valide (P22).
mise-en-page.workspace = true
# La longueur d'un texte dans l'unité d'un champ, comme le cœur la compte (TL-27, lot 11).
partie.workspace = true
# Couper une saisie entre deux graphèmes (TL-28, lot 11) ; la version du commun, déjà
# dans ce workspace par `partie`.
unicode-segmentation.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
# La toile, et, au lot 10a, le Worker de l'autorité, le clavier, le bandeau du commun.
# Au lot 10b : le son (`AudioContext`, un oscillateur et un gain par signal, les sons
# déclarés décodés), le clic (`MouseEvent`), `sessionStorage` (« Cliquer pour reprendre »).
web-sys = { workspace = true, features = [
    "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent", "KeyboardEvent",
    "Location", "HtmlElement", "CssStyleDeclaration", "Node", "Event", "EventTarget",
    "MouseEvent", "Storage", "AudioContext", "BaseAudioContext", "AudioContextState",
    "AudioNode", "AudioParam", "AudioDestinationNode", "OscillatorNode", "OscillatorType",
    "AudioScheduledSourceNode", "GainNode", "AudioBuffer", "AudioBufferSourceNode",
    # Au lot 11 : les composants posés sur la toile, le pointeur, les fichiers choisis,
    # déposés ou collés, les polices du DOM, les demandes du jeu.
    "HtmlInputElement", "HtmlAnchorElement", "File", "FileList", "DataTransfer", "DragEvent",
    "ClipboardEvent", "PointerEvent", "InputEvent", "FontFace", "FontFaceSet",
    "ImageEncodeOptions", "Blob",
] }
wasm-bindgen-futures.workspace = true

[dev-dependencies]
# Le banc compare l'agencement de chaque texte dessiné à celui du natif par le BLAKE3 de
# ses octets canoniques ; la version du commun.
blake3.workspace = true

# Le scénario `dessin` du banc dans un vrai navigateur (PHASE-3, lot 9) : une
# bibliothèque WebAssembly que `wasm-bindgen` relie à la page `dessin.html` du banc.
[[example]]
name = "dessin-banc"
path = "examples/dessin_banc.rs"
crate-type = ["cdylib"]

[lints]
workspace = true
