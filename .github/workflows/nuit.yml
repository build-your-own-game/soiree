# Long campaigns, on free Linux runners: what they find is read the next day.
# Never on a push. `schedule` only fires from the default branch; until this
# file is there, run it by hand (`workflow_dispatch`).
name: Nightly verification
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nuit
  cancel-in-progress: false
jobs:
  mutants:
    name: Mutations of salon-core
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the pinned toolchain
        run: rustup toolchain install 1.99 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: ${{ runner.os }}-${{ runner.arch }}-nuit-mutants-${{ hashFiles('salon/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-nuit-mutants-
      - name: Cache cargo-mutants
        id: mutants-cli
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/soiree-tools/cargo-mutants-27.1.0
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.99-mutants-27.1.0-v1
      - name: Install cargo-mutants
        shell: bash
        run: |
          set -euo pipefail
          cli="$RUNNER_TOOL_CACHE/soiree-tools/cargo-mutants-27.1.0"
          if [ "${{ steps.mutants-cli.outputs.cache-hit }}" != 'true' ]; then
            cargo +1.99 install --locked --force cargo-mutants --version 27.1.0 --root "$cli"
          fi
          test "$("$cli/bin/cargo-mutants" mutants --version)" = 'cargo-mutants 27.1.0'
          printf '%s\n' "$cli/bin" >> "$GITHUB_PATH"
      # cargo-mutants copies the workspace alone, and salon-host reaches into
      # ../remote: a workspace holding only salon-core stands on its own.
      - name: Isolate salon-core from the rest of the workspace
        id: isolate
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/salon-core"
          mkdir -p "$work/crates"
          cp salon/Cargo.toml salon/Cargo.lock salon/clippy.toml salon/rust-toolchain.toml "$work/"
          cp -R salon/crates/core "$work/crates/core"
          sed -i 's|^members = .*|members = ["crates/core"]|' "$work/Cargo.toml"
          count="$(cargo +1.99 metadata --no-deps --format-version 1 --manifest-path "$work/Cargo.toml" | jq '.packages | length')"
          test "$count" = '1'
          printf 'dir=%s\n' "$work" >> "$GITHUB_OUTPUT"
      - name: Run the campaign, with no threshold
        id: campaign
        shell: bash
        working-directory: ${{ steps.isolate.outputs.dir }}
        run: |
          set -euo pipefail
          code=0
          cargo mutants -p salon-core --no-config --jobs 3 --colors never \
            --minimum-test-timeout 30 --timeout-multiplier 5 \
            --output "$RUNNER_TEMP/mutants" || code=$?
          # Survivors (2) and timeouts (3) are what we came to read. Anything
          # else means the tool or the unmutated tests failed: no measure.
          case "$code" in
            0|2|3) ;;
            *) exit "$code" ;;
          esac
      - name: Summarize
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          outcomes="$RUNNER_TEMP/mutants/mutants.out/outcomes.json"
          test -f "$outcomes" || exit 0
          jq -r '"Mutants: \(.total_mutants) (caught \(.caught), missed \(.missed), timeout \(.timeout), unviable \(.unviable))"' "$outcomes" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-salon-core
          path: ${{ runner.temp }}/mutants/mutants.out
          retention-days: 30
          if-no-files-found: warn

  fuzz:
    name: Fuzz ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: salon-decode, project: salon, target: decode }
          - { name: salon-session, project: salon, target: session }
          - { name: remote-decode, project: remote, target: decode }
          - { name: remote-phone-session, project: remote, target: phone_session }
    env:
      # Pinned as the rest of the tools: a new nightly is a decision.
      NIGHTLY: nightly-2026-10-26
      SECONDS_PER_TARGET: '1500'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare nightly
        run: rustup toolchain install "$NIGHTLY" --profile minimal
      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: ${{ runner.os }}-${{ runner.arch }}-nuit-fuzz-${{ matrix.project }}-${{ hashFiles(format('{0}/fuzz/Cargo.lock', matrix.project)) }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-nuit-fuzz-${{ matrix.project }}-
      - name: Cache cargo-fuzz
        id: fuzz-cli
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/soiree-tools/cargo-fuzz-0.13.2
          key: ${{ runner.os }}-${{ runner.arch }}-${{ env.NIGHTLY }}-cargo-fuzz-0.13.2-v1
      - name: Install cargo-fuzz
        shell: bash
        run: |
          set -euo pipefail
          cli="$RUNNER_TOOL_CACHE/soiree-tools/cargo-fuzz-0.13.2"
          if [ "${{ steps.fuzz-cli.outputs.cache-hit }}" != 'true' ]; then
            cargo "+$NIGHTLY" install --locked --force cargo-fuzz --version 0.13.2 --root "$cli"
          fi
          printf '%s\n' "$cli/bin" >> "$GITHUB_PATH"
      # A cache key cannot be overwritten: each run saves under its own id and
      # restores the latest one, so the corpus keeps what every night found.
      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.project }}/fuzz/corpus/${{ matrix.target }}
          key: nuit-corpus-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: nuit-corpus-${{ matrix.name }}-
      - name: Fuzz, bounded in time
        working-directory: ${{ matrix.project }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "fuzz/corpus/${{ matrix.target }}"
          before="$(find "fuzz/corpus/${{ matrix.target }}" -type f | wc -l)"
          cargo "+$NIGHTLY" fuzz run "${{ matrix.target }}" -- \
            -max_total_time="$SECONDS_PER_TARGET" -timeout=10 -rss_limit_mb=4096 \
            -print_final_stats=1 2>&1 | tee "$RUNNER_TEMP/fuzz.log"
          after="$(find "fuzz/corpus/${{ matrix.target }}" -type f | wc -l)"
          runs="$(sed -n 's/^stat::number_of_executed_units: *//p' "$RUNNER_TEMP/fuzz.log")"
          printf '%s: %s runs, corpus %s -> %s\n' "${{ matrix.name }}" "$runs" "$before" "$after" >> "$GITHUB_STEP_SUMMARY"
      - name: Save the corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.project }}/fuzz/corpus/${{ matrix.target }}
          key: nuit-corpus-${{ matrix.name }}-${{ github.run_id }}
      - name: Keep what crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.name }}
          path: ${{ matrix.project }}/fuzz/artifacts/${{ matrix.target }}
          retention-days: 90
          if-no-files-found: warn
