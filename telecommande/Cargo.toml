# La brique « télécommande » : le téléphone trouve le jeu par un QR code et
# lui parle. Un seul crate pour les deux côtés : `host` et `pages` sur
# l'ordinateur, `web` dans le navigateur.
[package]
name = "telecommande"
description = "Brique de la console : relier le jeu, l'écran et les téléphones."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tower-http = { version = "0.7", features = ["fs", "set-header"] }
# Fabrique le JavaScript qui charge les pages. Sa version est exactement celle
# de `wasm-bindgen` ci-dessous : personne n'a d'outil à installer à côté.
wasm-bindgen-cli-support = "=0.2.130"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
web-sys = { version = "0.3", features = [
  "CloseEvent",
  "Crypto",
  "Location",
  "MessageEvent",
  "Storage",
  "UrlSearchParams",
  "WebSocket",
  "Window",
  "console",
] }

[lints]
workspace = true
