# La brique « télécommande » : le programme de tous les jeux. Le téléphone
# trouve le jeu par un QR code et lui parle. Un seul crate pour les deux
# côtés : `console` sur l'ordinateur, `web` dans le navigateur.
[package]
name = "telecommande"
description = "Brique de la console : relier le jeu, l'écran et les téléphones."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cartouche = { path = "../cartouche" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Le journal d'une partie, que la console écrit.
cartouche = { path = "../cartouche", features = ["journal"] }
axum = { version = "0.8", features = ["ws"] }
# L'heure locale de l'hôte, pour la machine qui demande la date.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rustls-pki-types = { version = "1.16.0", features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tower-http = { version = "0.7", features = ["fs", "set-header"] }
# Interroge internet pour la machine qui le demande.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Fabrique le JavaScript qui charge les pages. Sa version est exactement celle
# de `wasm-bindgen` ci-dessous : personne n'a d'outil à installer à côté.
wasm-bindgen-cli-support = "=0.2.130"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
web-sys = { version = "0.3", features = [
  "Blob",
  "CloseEvent",
  "Crypto",
  "Location",
  "MessageEvent",
  "Storage",
  "UrlSearchParams",
  "WebSocket",
  "Window",
  "XmlHttpRequest",
  "XmlHttpRequestEventTarget",
  "console",
] }

[lints]
workspace = true
