[package]
name = "remote-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde = "1"
remote-protocol = { path = "../crates/protocol" }
remote-core = { path = "../crates/core" }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "phone_session"
path = "fuzz_targets/phone_session.rs"
test = false
doc = false
bench = false

# Kept out of the remote's workspace: built only by `cargo +nightly fuzz`.
[workspace]
members = ["."]
