[workspace]
resolver = "3"
members = ["crates/protocol", "crates/core", "crates/ffi", "crates/web", "crates/demo", "crates/demo-page", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"
publish = false

[workspace.dependencies]
remote-protocol = { path = "crates/protocol" }
remote-core = { path = "crates/core" }
uniffi = "0.32"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
# Same results on iOS, the Mac and WASM, unlike the platform's own trigonometry.
libm = "0.2"
serde_json = "1"
# Must match the installed wasm-bindgen CLI exactly (cargo xtask page).
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
web-sys = "0.3"
remote-web = { path = "crates/web" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Du bruit dans du code de jeu : conversions entier → flottant partout, documentation d'API publique inutile ici.
cast_precision_loss = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Chaque exception est explicite et justifiée : #[expect(lint, reason = "...")], jamais #[allow].
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Un `.expect()`, un `panic!` ou un index hors bornes arrêtent la partie autant qu'un `unwrap`.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
todo = "deny"

# Un jeu compilé en debug sans optimisation est injouable : on optimise les dépendances même en dev.
[profile.dev.package."*"]
opt-level = 3

# Un dépassement d'entier est un bug, même en release.
[profile.release]
overflow-checks = true
