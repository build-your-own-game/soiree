[package]
name = "remote-demo"
description = "A fake game for the remote: serves /remote, shows its QR code, prints what phones send."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
remote-protocol.workspace = true
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
qrcode = { version = "0.14", default-features = false }

[lints]
workspace = true

# The workspace is also checked for wasm32 (the manifesto's commands): there,
# tungstenite's random keys need the browser's source of randomness.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
