<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Page en Rust</title>
<style>
  html, body { margin: 0; height: 100%; background: #14161b; color: #fff; font: 600 16px -apple-system, sans-serif;
    touch-action: none; -webkit-user-select: none; user-select: none; }
  body { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px;
    padding: 0 max(16px, env(safe-area-inset-right)) 0 max(60px, env(safe-area-inset-left)); box-sizing: border-box; }
  #buzz { width: 42vmin; height: 42vmin; border-radius: 50%; display: grid; place-items: center; font-size: 5vmin;
    background: radial-gradient(circle at 35% 30%, #b58cff, #7c3aed); box-shadow: 0 1vmin 0 #4c1d95; }
  #buzz.down { transform: scale(0.94); filter: brightness(0.85); }
  pre { margin: 0; font: 13px ui-monospace, monospace; white-space: pre-wrap; opacity: 0.85; }
  button { font: inherit; color: #fff; background: #3a86ff; border: 0; border-radius: 10px; padding: 9px 12px; }
</style>
<pre id="info"></pre>
<div id="buzz">RUST</div>
<div><button id="turn">portrait / paysage</button><pre id="motion">—</pre><pre id="echo">—</pre></div>
