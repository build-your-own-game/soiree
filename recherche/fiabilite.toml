suppose = "Quels débit et tampon valent un vrai Wi-Fi : les quatre tuyaux du chaos sont choisis sous 60 000 octets par seconde, avec le tampon de str0m ou plus petit. Le banc n'a ni pertes en rafale, ni partage entre téléphones."

