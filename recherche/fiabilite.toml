[[trou]]
id = "T1"
titre = "Un message plus gros que ce que le tuyau passe d'un renvoi au suivant n'arrive jamais, et bloque tout ce qui le suit"
gravite = "haute"
lieux = [
  "salon/crates/core/src/stream.rs:223",
  "salon/crates/core/src/stream.rs:453",
  "salon/crates/core/src/wire.rs:55",
  "salon/crates/host/src/rtc.rs:177",
]
cas = "Chaque renvoi repart du fragment 0 et l'accusé ne dit rien d'un message incomplet. Un tuyau qui garde le début d'une rafale et jette la fin transporte donc toujours les mêmes fragments. Sur un tuyau simulé à tampon de 32 Kio, 60 000 octets : 0 message sur 1 en 120 s, à 1, 5 et 20 Mb/s, avec 325 à 1 230 fois sa taille offerte. Avec le tampon de 128 Kio de str0m : 5 messages de 60 000 octets à 300 kb/s, 2 sur 5 en 120 s ; 5 de 32 000 à 200 kb/s, 4 sur 5. Comme la file est ordonnée, tous les événements suivants restent derrière. send rend Ok, le lien reste vivant, rien ne remonte au jeu. L'état a le même chemin."
preuve = "Sondes s6_a_message_bigger_than_the_pipe_still_arrives, s6c et s6d : échec sur les sources intactes. La seule rotation du fragment de départ à chaque passe (copie isolée) donne 1 sur 1 en moins d'une seconde aux trois débits, 5 sur 5 en 19,5 s à 300 kb/s, 5 sur 5 en 12,3 s pour 5 x 32 000 à 200 kb/s, et 500 cas verts de chaos à rafale bornée ; les suites de salon-core restent vertes. La rotation ne suffit pas à tout : à 100 kb/s, 5 x 60 000 reste à 4 sur 5 en 120 s. Fermé. Accusés par fragment, avec le découpage qu'ils nomment : à 1 Mb/s et 32 Kio, 60 000 octets passent de 0 message en 120 s à 941 kb/s utiles ; 5 x 60 000 à 300 kb/s et 128 Kio, de 2 sur 5 à 5 sur 5 en 8,6 s, 280 kb/s. Il a fallu la fenêtre de T3 pour 100 kb/s : 5 sur 5 en 31,5 s, 76 kb/s. Les renvois se mettaient sinon en file derrière leurs originaux. Le chaos a trouvé trois bugs de ces correctifs : un accusé de l'ancien découpage arrêtait les fragments du nouveau ; sur un flux, un accusé qui ne nomme que le passé ne prouvait rien, et sans minuterie rien ne repartait ; et la fenêtre comptait un petit fragment pour un découpage entier, ce qui bloquait un fragment perdu derrière elle."
verifie = "salon-core sur un tuyau simulé avec débit et tampon qui jette l'excédent, à message de 60 000 octets ; lu dans le code : 128 Kio par association dans str0m 0.24.1, write qui rend false, résultat ignoré par rtc.rs. Sur le tuyau simulé de Net, aux débits et tampons du test, et dans 24 000 cas de chaos à tuyau étroit."
suppose = "Que la pile SCTP réelle se comporte comme ce tuyau, qui garde le début d'une rafale et jette la fin : pas rejoué avec str0m, ni sur Wi-Fi. Que le Wi-Fi perde sans réordonner beaucoup : trois signalements suffisent sur le banc, jamais mesurés en vrai. Le retour de write de str0m reste ignoré. Le banc ne simule pas le contrôle de congestion de SCTP lui-même."

[[trou]]
id = "T2"
titre = "Un trou dans la file fait jeter tout ce qui suit jusqu'au renvoi suivant"
gravite = "moyenne"
lieux = [
  "salon/crates/core/src/stream.rs:315",
  "salon/crates/core/src/stream.rs:1",
]
cas = "InEvents ne lit que le numéro attendu, et l'expéditeur n'apprend le trou qu'à sa minuterie. Sur un tuyau de 2 Mb/s à 5 % de perte, 100 événements de 2 000 octets prennent 12,6 s au lieu de 0,8, pour 12 fois leur taille. Sur le banc, 200 événements de 900 octets prennent 10,3 s sans aucune perte, à cause d'une gigue de 5 ms."
preuve = "Sondes s7 et s6_table. Un tampon de 64 numéros au récepteur (copie isolée) donne 0,27 s sans perte, 0,57 s à 10 % de perte au lieu de 11,9, et 2,3 s au lieu de 12,6 sur le tuyau. La suite reste verte sauf a_gap_and_a_repeat_deliver_nothing_and_are_not_garbage, qui écrit le comportement actuel : ce test changerait avec le correctif. Fermé. 64 numéros gardés au récepteur, 1 024 fragments au plus, et un renvoi après trois accusés : 200 événements de 900 octets passent de 10,33 s à 0,05 s sans perte, de 11,91 s à 0,36 s à 10 % de perte. Le test a_gap_and_a_repeat_deliver_nothing_and_are_not_garbage écrivait l'ancien comportement : il devient a_gap_waits_for_its_turn_and_a_repeat_delivers_nothing."
verifie = "salon-core sur le banc et sur le tuyau simulé, moyenne de 5 graines pour s7. Moyenne de 5 graines sur le banc."
suppose = "L'effet sur un vrai jeu : de petits événements tiennent à vingt par paquet, donc un seul paquet perdu en emporte peu. La gigue uniforme du banc sur une rafale est plus dure qu'un vrai Wi-Fi. Le seuil de trois signalements vient de SCTP et de TCP : à 2 ou 5, le banc donne le même débit à quelques pour cent près, il ne le départage pas."

[[trou]]
id = "T3"
titre = "Salon ne ralentit jamais : tout part d'un coup, et repart au même rythme sur un lien muet ou saturé"
gravite = "moyenne"
lieux = [
  "salon/crates/core/src/stream.rs:208",
  "salon/crates/core/src/stream.rs:629",
  "salon/crates/core/src/host.rs:705",
  "salon/crates/core/src/client.rs:490",
]
cas = "BURST ne borne rien : poll relance flush dès que l'outbox est vide, donc toute la file part au même instant. Le renvoi ne recule pas. Sur 5,9 s de silence avant Timing::absent, un état de 60 000 octets à 10 ms d'aller-retour coûte 3 599 paquets, 3,6 Mo, 60 fois sa taille. 20 événements de 8 000 octets à 1 Mb/s coûtent 2,3 fois leur taille, dont 48 % jetés. Le refus de str0m ne remonte pas."
preuve = "Sondes s6b et s6_a_full_queue. Allonger l'attente du silence en cours, plafonnée à resend_max, dans host.rs seul : de 60 à 6,1 fois la taille, suites vertes. Une fenêtre fixe de 64 Kio en vol : de 2,3 à 1,4 fois, 0 % jeté à 1 Mb/s, suites vertes, mais à 300 kb/s 20 x 8 000 tombe de 20 sur 20 à 12 sur 20 en 120 s : une fenêtre doit suivre les accusés. Fermé. Fenêtre de dix paquets qui suit les accusés, moitié à chaque perte, plancher de deux paquets, plafond de 96 Kio, et attente doublée à chaque minuterie expirée : sur 5,9 s de silence, 60 000 octets passent de 60,3 à 0,8 fois leur taille ; 20 x 8 000 à 1 Mb/s, de 2,26 à 1,04 fois, 0 % jeté. Le prix sur un lien rapide : 1 x 60 000 passe de 10 à 30 ms sur le banc, 5 x 60 000 de 10 à 60 ms."
verifie = "Les octets offerts par salon-core sur tuyau simulé et sur coupure. Les octets offerts sur tuyau simulé et sur coupure, avant et après."
suppose = "Ce que cela coûte sur un Wi-Fi partagé par quinze téléphones : pas mesuré. Le plafond de 96 Kio vient de la lecture de str0m, 128 Kio moins les en-têtes : sur le banc, 64 ou 256 Kio donnent les mêmes chiffres, il n'y est jamais atteint. Dix paquets au départ viennent de la RFC 9002 : 4 fait aussi bien sur le banc, 30 fait pire à 100 kb/s. À 50 kb/s, une minuterie plafonnée à resend_max renvoie encore à tort : 2,2 fois la taille."

[[trou]]
id = "T4"
titre = "Sur WebSocket, les renvois s'empilent devant ce qui est frais"
gravite = "moyenne"
lieux = [
  "salon/crates/core/src/stream.rs:224",
  "salon/crates/core/src/types.rs:211",
  "salon/crates/host/src/room.rs:79",
]
cas = "Un WebSocket ne perd rien, mais le renvoi à la minuterie y tourne quand même. Sur un lien sans perte de 300 kb/s, un état de 60 000 octets toutes les 2 s fait monter la file à 1 805 Kio, soit 49 s de retard : 15 états vus sur 30."
preuve = "Sonde s8 : même lien, sans renvoi à la minuterie sur un lien en flux (copie isolée) : 1,0 fois la taille, 1,6 s de file, 30 états sur 30, suites vertes. Fermé. Pas de minuterie sur un lien en flux : ce que l'hôte jette avant le socket est prouvé perdu par un écho de ce qui est parti après. À 300 kb/s, 60 000 octets toutes les 2 s : de 2,37 à 1,00 fois la taille, de 1 862 à 58 Kio de file, de 16 à 30 états vus sur 30."
verifie = "salon-core sur un tuyau sans perte, à file de 256 paquets de 16 Kio comme OUTBOX. Le flux simulé garde l'ordre ; 20 % de paquets y sont jetés dans le test de reprise, et le chaos y perd jusqu'à 30 %."
suppose = "Le comportement d'un vrai TCP lent. Qu'une page ou un jeu ne déclare un paquet de plus de 1 100 octets que sur un flux : Caps n'a pas de champ pour le dire, et salon le déduit de la taille, ce qui n'a pas changé l'API. Une perte en fin de flux attend le prochain écho, soit jusqu'à deux battements. Il n'y a pas de minuterie de secours : si la preuve par l'écho avait encore un trou, un flux vivant resterait muet sans erreur, et le chaos en a déjà trouvé deux avant d'être vert."

[[trou]]
id = "T5"
titre = "Un gros état rafraîchi plus vite que son renvoi n'arrive jamais"
gravite = "moyenne"
lieux = [
