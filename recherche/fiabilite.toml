cas = "set efface ce qui a été envoyé, et le récepteur jette l'assemblage du numéro précédent. Tout fragment perdu tue l'état s'il est remplacé avant son renvoi. Pour un état montré toutes les 100 ms pendant 30 s : 30 000 octets à 10 % de perte, 10 sur 300 ; 60 000 octets, 0 sur 300. La documentation promet qu'il est renvoyé jusqu'à son arrivée."
preuve = "Sondes s3 et s3_a_big_state_refreshed_often_still_arrives. Laisser finir un état de plusieurs fragments déjà en vol et garder le plus récent en attente (copie isolée) : 193 sur 300 et 165 sur 300, suites vertes. Fermé. Un état de plusieurs fragments déjà parti finit, et le dernier montré le remplace : 135 sur 300 à 30 000 octets, 114 sur 300 à 60 000, à 10 % de perte."
verifie = "salon-core sur faux réseau. Faux réseau, une graine."
suppose = "Aucun jeu lu n'envoie de gros état fréquent sur DataChannel : Sidequest envoie à chaque pas vers une TV locale, en WebSocket, et les téléphones ne reçoivent qu'un changement. Le comportement vu d'un jeu change : une page peut afficher un état de plus avant le dernier, ce que dit CHANGELOG.md."

