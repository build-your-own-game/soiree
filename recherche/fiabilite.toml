preuve = "Chaos élargi : messages de 60 Ko, alternance WebSocket et WebRTC, 40 % de doublons, 200 ms de gigue, 3 000 cas verts : il ne voit rien non plus. La seule limite de 32 000 octets par pas dans Net::schedule le fait échouer au premier cas, réduit à un seul événement de 31 260 octets. Avec la rotation de T1, 500 cas verts. Fermé. Net a Narrow, un débit et un tampon par sens et par lien, un flux garde son ordre, et le chaos envoie 60 000 octets en événement et en état. Avant les correctifs, T1, T3 et T4 y étaient rouges."
