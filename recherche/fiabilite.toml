[saturation]
sources = ["yojimbo", "neqo", "geckos"]
derniere_lecon = "ioq3-client"
note = "Les trois dernières sources couvrent un moteur fiable de jeu et deux codes client, dont celui de Firefox. Elles n'apportent aucune leçon nouvelle. Trois résultats positifs sont à garder avec cette fiche : à débit non borné, 3 000 cas de chacun des deux chaos existants et 3 000 cas d'un chaos à gros messages n'ont trouvé ni perte, ni doublon, ni désordre, ni mélange de fragments ; le décodage hostile tient ; aucun numéro d'événement ou d'état ne revient à zéro. Les trous sont aux bords : débit, tampons, configuration, paquets en retard."

[saturation.recoupe]
yojimbo = "Fragments d'un bloc accusés un par un : déjà T1. Calcul de fragments en 64 bits et plafond à la création : déjà T8 et T12. Délai minimal entre deux renvois d'un message : déjà la minuterie de salon."
neqo = "Borne sur les trous du réassemblage : déjà fiabilite-09 et fiabilite-34. Recul de PTO et variance du temps d'aller-retour : déjà T3 et fiabilite-39. Ses cibles de fuzz recoupent salon/fuzz."
geckos = "Le fiable émulé répète un message dix fois et le client filtre les doublons par identifiant pendant 15 s : déjà dans salon/LEARNINGS.md et fiabilite-52. Son serveur jette le non-fiable quand bufferedAmount monte : ce retour du canal rejoint fiabilite-23."

[cout]
minutes = 36
references = 29
sondes_executees = 24
note = "Temps horloge d'un agent, clones, recompilations et rédaction inclus : 31 minutes mesurées depuis les hypothèses, 5 estimées pour la lecture qui les précède. 14 dépôts clonés, 8 RFC et 3 articles lus. 13 correctifs d'une seule cause éprouvés sur une copie, chacun avec les suites de salon-core. Les citations ont été confrontées à l'amont par soiree recherche verifie."
