[[trou]]
id = "T1"
titre = "Après un rechargement, les états tenus n'atteignent plus le jeu"
gravite = "haute"
lieux = [
  "salon/crates/core/src/host.rs:430",
  "salon/crates/core/src/stream.rs:454",
  "salon/crates/core/src/stream.rs:361",
  "salon/crates/core/src/client.rs:150",
  "salon/crates/core/src/wire.rs:106",
]
cas = "Une page envoie 50 set_state, recharge (ou panique, C10), puis envoie 10 set_state : 0 sur 10 atteint le jeu. Le nouveau Client numérote depuis 1, l'hôte garde in_state.applied à 50, ignore les états et accuse quand même : Client::set_state rend Ok, rien ne remonte. Hello.resume distinguerait ce cas, mais host.rs ne le lit jamais, contrairement à ce qu'annonce wire.rs."
preuve = "sonde h1 : 0/10 sur les sources intactes ; 10/10 en remettant in_state à zéro quand resume est absent (copie isolée) ; les suites salon.rs et properties.rs restent vertes."
verifie = "salon-core sur faux réseau"
suppose = "Effet sur Sidequest : le stick passe par set_state (crates/controller/src/session.rs) et resterait mort jusqu'à dépasser l'ancien numéro. Lu dans le code, pas rejoué dans le jeu."

[[trou]]
id = "T2"
titre = "Après « Jouer ici », les événements de l'onglet repris se perdent sans erreur"
gravite = "haute"
lieux = [
  "salon/crates/core/src/client.rs:377",
  "salon/crates/core/src/stream.rs:275",
]
cas = "Onglet 1 remplacé, onglet 2 envoie 3 événements, onglet 1 reprend (Client::resume) puis envoie 2 événements : aucun n'arrive. L'onglet 1 garde son compteur, numérote 0 et 1 sous up_next = 3 ; l'hôte les ignore et les accuse. send a rendu Ok. Punchline et Sidequest offrent ce bouton."
preuve = "sonde h2 : 3 événements au lieu de 5 ; 5 sur 5 en renumérotant quand up_next dépasse le compteur (copie isolée), tests existants verts."
verifie = "salon-core sur faux réseau"
suppose = "Fréquence réelle inconnue : il faut un jumeau qui a envoyé des événements, puis un retour au premier onglet."

[[trou]]
id = "T3"
titre = "Un Hello sur un lien en fin de vie reprend l'appareil au lien courant"
gravite = "haute"
lieux = [
  "salon/crates/core/src/host.rs:386",
  "salon/crates/core/src/host.rs:659",
  "salon/crates/core/src/host.rs:543",
]
cas = "Host::hello ne regarde pas closing. Après replace ou refuse, le lien reste une seconde sans appareil : une copie de Hello y arrive, passe tout le chemin et éjecte le lien courant. Deux onglets simultanés à 20 % de pertes, 10 % de doublons, 80 ms de gigue : les deux finissent Replaced dans 138 graines sur 2000. Si le pair ne ferme pas, flush retire le lien sans detach : l'appareil reste Weak pour toujours, sans Left, et son retour ne donne ni Left ni Back. Un Hello sur un lien refusé Full crée un appareil fantôme qui garde la salle pleine."
preuve = "sondes h3, h3b, h3c, h3d ; la seule garde `if current.closing { return; }` (copie isolée) ramène 138 à 0 et lève le fantôme, tests existants verts."
verifie = "salon-core sur faux réseau, avec Faults du banc"
suppose = "Taux à 20 % de pertes seulement ; pas mesuré sur un vrai Wi-Fi."

