]
cas = "Tentative lancée puis page gelée. Au réveil à 8 s, wake ne fait rien : l'échéance reste à 20 s (15 s RTC + 5 s TCP), au-delà des 10 s de C3."
preuve = "sonde h5 : aucune sortie après wake, échéance inchangée."
