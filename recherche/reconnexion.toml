[saturation]
sources = ["signalr-client", "livekit", "graphql-ws"]
derniere_lecon = "centrifuge-js"
note = "Les références centrifuge, signalr-spec et mqtt5 n'avaient apporté aucune leçon nouvelle, ce qui remplissait déjà la règle des 3 ; la poursuite a trouvé deux leçons dans centrifuge-js. Ces trois lectures portaient sur des serveurs et des spécifications : seul le code client avait encore à dire. Les 3 sources retenues sont donc postérieures à centrifuge-js."

