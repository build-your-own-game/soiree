[[trou]]
id = "T1"
titre = "Une seule page peut tuer WebRTC pour toute la soirée"
gravite = "haute"
lieux = [
  "salon/crates/crypto/Cargo.toml:23",
  "salon/crates/host/src/http.rs:104",
  "salon/crates/host/src/rtc.rs:252",
]
cas = "dimpl 0.7.6 fait `assert_eq!(seq_current.epoch, 0)` sur un doublon d'époque 1 reçu avant le CCS (engine.rs:381). Le fil qui sert toutes les pages est lancé par `thread::spawn`, sans surveillance : la panique le tue. N'importe quel appareil du Wi-Fi peut le faire, sans jeton : une offre, ICE, puis deux fois le même enregistrement d'époque 1. Tous les téléphones perdent leur canal d'un coup, se taisent environ 6 s, puis passent en WebSocket jusqu'au redémarrage de l'hôte. Chaque offre suivante reçoit 503. E1 promet que l'hôte et les autres joueurs continuent."
preuve = "Sonde t1 : hôte réel, deux téléphones Chromium 151 ou WebKit 27.2 ouverts, pair attaquant en Rust. `panicked at dimpl-0.7.6/src/dtls12/engine.rs:381`, offre suivante HTTP 503, canaux fermés, WebSocket à 6,4 s, nouveau téléphone en WebSocket. En retirant cette seule assertion (correctif amont 71010a7), l'attaque ne fait plus rien : canaux ouverts, offre 200, nouveau téléphone en WebRTC. Fuzz en mémoire : 88 paniques en 15 208 essais, toutes à cette ligne ; 0 en 10 292 essais une fois l'assertion retirée. Variante `catch_unwind` autour de handle_input et drive : l'assertion panique, seul le lien fautif tombe."
verifie = "La panique, sa ligne, l'arrêt du fil, l'effet sur Chromium et WebKit, le 503 qui suit, et les deux correctifs, sur une copie de salon par la boucle locale."
suppose = "Qu'elle arrive sans malveillance chez nous : Chromium 151 et WebKit 27.2 mettent Certificate, CKE, CCS et Finished dans le même datagramme, donc une perte naturelle n'isole pas le Finished, et les 98 pannes unitaires n'ont rien déclenché. La flotte de l'issue 189 la voit par réseau. Fermé par l'isolation, pas par une correction de dimpl : la panique reste, un attaquant qui usurpe la source d'une page en poignée de main peut lui coûter son lien (T11). Tout cela suppose le déroulement de pile : aucun profil de salon, du modèle ni des trois jeux n'écrit `panic = \"abort\"`, et l'hôte le dit au lancement si un jeu l'écrit."

[[trou]]
id = "T2"
titre = "Là où l'UDP n'arrive pas, chaque coupure coûte 15 s et C2 n'est pas tenu"
gravite = "haute"
lieux = [
  "salon/crates/web/src/lib.rs:886",
  "salon/crates/web/src/lib.rs:687",
  "salon/crates/web/src/rtc_memory.rs:109",
  "salon/crates/web/src/lib.rs:400",
]
cas = "UDP perdu, TCP sain : un téléphone neuf attend 15,1 s avant WebSocket, et chaque téléphone paie, parce que la mémoire est par onglet. Ensuite, sur un lien WebSocket sain qui se coupe, la reprise repasse par WebRTC : 15,3 s à la première coupure, parce qu'un seul échec ne suffit pas dans la page, 15,6 s après un événement `online`, 16,1 s une fois la mémoire vieille de 10 min. C2 donne 10 s. Pendant ce temps, le joueur ne joue pas. La réponse SDP est pourtant arrivée aussitôt : seul ICE reste sans réponse, et le navigateur met 15 à 30 s à dire `failed`."
preuve = "Sonde tudp : relais UDP muet, vrai hôte, Chromium 151 et WebKit 27.2, deux téléphones : 15,1 et 15,2 s à rejoindre ; coupures à 15,3, 15,6 et 16,1 s. Sur la copie, une seule échéance ajoutée (3 s après la réponse appliquée, ICE encore `new` ou `checking`, repli) donne 3,3 s à rejoindre et 3,3 à 4,1 s aux trois coupures sur Chromium, 3,2 s et 3,3 à 3,9 s sur WebKit. Une réponse SDP retardée de 4 s reste en WebRTC (4,2 s), et les pertes de 10, 25 et 40 % ne déclenchent pas plus de replis : 12/12, 12/12 et 9/12 en WebRTC, contre 12/12, 10/12 et 5/12 sans la variante."
verifie = "Les durées de bout en bout sur Chromium et WebKit, l'échec de C2 pour une coupure de lien, et l'effet de la seule échéance sur les deux moteurs."
suppose = "Combien de réseaux réels passent TCP et perdent UDP : le pare-feu de macOS coupe les deux (REPETITION.md). T3 et T9 sont d'autres façons d'y arriver. Le seuil de 3 s n'est mesuré que sur 36 essais avec pertes, et jamais sur un iPhone. Une offre dont la réponse tarde reste bornée par les 15 s absolues : ICE n'a rien à dire avant la réponse. Correctif plus ambitieux à trancher : lancer WebSocket en parallèle et monter en WebRTC ensuite (RFC 8305)."

[[trou]]
id = "T3"
titre = "L'adresse annoncée est figée au lancement, quelle que soit celle que le téléphone a vraiment jointe"
gravite = "moyenne"
lieux = [
  "salon/crates/host/src/http.rs:76",
  "salon/crates/host/src/rtc.rs:63",
  "salon/crates/host/src/rtc.rs:237",
]
cas = "`rtc_address` est calculée une fois, depuis la route par défaut ou SALON_PUBLIC_URL si son hôte est une adresse IP. Un Mac à deux interfaces, un DHCP qui change l'adresse en cours de soirée, ou une URL publique par nom : le téléphone charge la page par une adresse et reçoit un candidat par lequel il ne passe pas. Il paie alors T2 à chaque connexion. Le socket TCP de l'offre connaît pourtant la bonne adresse."
preuve = "Sonde taddr, sur une copie sans candidat de bouclage pour jouer un téléphone, candidat annoncé 192.0.2.77 : repli à 15,1 s sur Chromium, 15,3 s sur WebKit. En prenant le candidat de `stream.local_addr()` de la connexion de l'offre, seul changement : WebRTC en 276 ms et 413 ms."
verifie = "La cause et le correctif, par la boucle locale, sur Chromium et WebKit."
suppose = "Fréquence réelle : aucun Mac à deux interfaces n'a été essayé. La destination par lien est prouvée en mémoire, sur les vraies piles, pas sur un vrai réseau à deux adresses : le pare-feu de ce Mac coupe l'adresse réseau. L'adresse de `SALON_PUBLIC_URL` et la route par défaut restent annoncées après celle de l'offre, pour un port redirigé que le socket ne peut pas connaître."

[[trou]]
id = "T4"
titre = "Un paquet de plus de 1 062 octets part en deux fragments, et la perte double"
gravite = "moyenne"
lieux = [
  "salon/crates/core/src/types.rs:208",
  "salon/crates/host/src/rtc.rs:57",
]
cas = "Caps::DATAGRAM vaut 1 100 octets pour rester sous une trame, mais str0m retire 48 + 40 octets de son MTU de 1 150 : la charge SCTP est de 1 062. Tout paquet de l'hôte entre 1 063 et 1 100 octets part en deux datagrammes, sur un canal où un fragment perdu abandonne le message. Un état ou un lot d'événements plein est justement ce cas."
preuve = "Sonde mtu, deux str0m en temps virtuel : 1 062 octets donnent 1 datagramme, 1 063 en donnent 2 ([1129, 69]), 1 100 en donnent 2 ([1129, 105]). Sous 10 % de pertes, 61,9 % de paquets de 1 100 octets livrés contre 81,7 % avec `set_mtu(1188..)`, seul changement, qui donne 1 datagramme de 1 165 octets. À 5 % : 86,6 contre 94,5. À 20 % : 20,5 contre 32,4."
verifie = "Le comptage des datagrammes et la livraison sous perte sur les vraies piles str0m et sctp-proto. Chromium 151 et WebKit 27.2 envoient eux-mêmes 1 100 octets en un datagramme de 1 165 : la voie montante n'a pas le défaut."
suppose = "La part de paquets au-dessus de 1 062 octets dans un vrai jeu : non mesurée. Que 1 165 octets passent partout : l'iPhone en partage de connexion et une borne réelle n'ont pas été mesurés."

[[trou]]
id = "T5"
titre = "Le canal sans retransmission accumule des secondes de retard derrière lui"
gravite = "moyenne"
lieux = [
  "salon/crates/host/src/rtc.rs:177",
  "salon/crates/web/src/lib.rs:62",
]
cas = "L'hôte écrit dans le canal sans regarder `buffered_amount` ; str0m garde 128 Kio. Quand un téléphone reçoit moins vite que le jeu n'envoie, les états frais attendent derrière les états périmés. Le canal est non fiable, mais son tampon ne l'est pas : la perte qu'on voulait n'arrive qu'une fois la file pleine. La page a une garde, mais à 64 Kio."
preuve = "Sonde mtu, lien borné à file finie, 60 Hz : 30 Ko/s et 1 000 octets donnent 6,7 s de retard maximal sans garde, 160 ms en sautant l'écriture au-delà de 4 Kio bufferisés, seul changement. 30 Ko/s et 500 octets : 2,5 s contre 154 ms. 60 Ko/s et 1 000 octets : 1,7 s contre 71 ms."
verifie = "Le retard sur les vraies piles str0m et sctp-proto, avec un modèle de lien dans la sonde. La garde de 4 Kio seuls, celle de la sonde, ne tient pas : sur un lien sain elle perd à chaque renvoi les mêmes derniers fragments d'une rafale, un message de 4 000 octets n'arrivait plus, et après une coupure elle laisse tout au minuteur de SCTP (6,8 s au lieu de 4 s pour 3 s de coupure). La garde retenue (`salon_core::transport::Backlog`) ne saute qu'au-delà de 4 Kio tenus 100 ms, et laisse passer un paquet toutes les 100 ms : 333 ms de retard à 30 Ko/s, 101 ms à 60 Ko/s, et une reprise égale ou meilleure que sans garde sur sept durées de coupure."
suppose = "Qu'un téléphone tombe à ces débits en soirée, et l'effet côté page, où les messages sont petits et où `bufferedAmount` ne compte pas la même chose : rien n'y a été mesuré. Les valeurs : 4 Kio et 100 ms sont des choix de sonde ; LiveKit règle la sienne sur 100 ms du débit observé. Le rattrapage de SCTP après une coupure, lui, reste celui de sctp-proto, jusqu'à 4 s pour 3 s de coupure, en temps virtuel."

[[trou]]
id = "T6"
titre = "Un 503 sur l'offre est compté comme un échec de WebRTC"
gravite = "faible"
lieux = [
  "salon/crates/web/src/lib.rs:939",
  "salon/crates/web/src/rtc_memory.rs:43",
]
cas = "`negotiate` passe à Offer::Answered sur n'importe quelle réponse HTTP. Un 503 (file de signaux pleine) ou un 400 donne Negotiation::Failed et Blame::WebRtc, et la page rechargée reste en WebSocket dix minutes alors que WebRTC marche. rtc_memory écrit pourtant qu'une offre sans réponse ne dit rien de WebRTC."
preuve = "Sonde t503, Chromium : un seul 503, mémoire `failures:1`, rechargement sans aucune PeerConnection créée alors que l'offre répond de nouveau. Avec `if !response.ok() return Negotiation::NoHost`, seul changement : mémoire vide, WebRTC au rechargement en 127 ms."
verifie = "Le comportement dans Chromium, et le correctif."
suppose = "Un 503 reste rare : file de 64 signaux, ou fil WebRTC mort (T1), où le repli est le bon choix."

[[trou]]
id = "T7"
titre = "Rien ne borne les offres en cours, et elles ralentissent les liens vivants"
gravite = "faible"
lieux = [
  "salon/crates/host/src/rtc.rs:153",
  "salon/crates/host/src/http.rs:445",
]
cas = "Chaque POST /salon/offer crée un Rtc gardé 15 s. Aucun quota : une boucle sur cet ordinateur en fait accepter 1 400 par seconde. Le fil unique parcourt toutes les entrées pour chaque datagramme et à chaque tour. E3 promet qu'un téléphone qui inonde ne ralentit pas les autres."
preuve = "Sonde tflood, téléphone Chromium ouvert : aller-retour de 0 ms avant, 75 ms de médiane et 85 ms au pire après 12 s de flot, 17 048 offres acceptées, 190 Mo de mémoire pour 10 174 offres. Avec au plus 64 négociations, la plus ancienne évincée, seul changement : 6 ms de médiane, 8 ms au pire."
verifie = "La dégradation et le correctif, par la boucle locale."
suppose = "L'effet à 15 téléphones et 60 Hz, non mesuré. Il faut un appareil hostile : aucun chemin normal n'accumule des offres. Pendant un tel flot, une page honnête peut voir sa négociation évincée : elle passe alors en WebSocket par T2, et les liens ouverts ne paient rien."

[[trou]]
id = "T8"
titre = "SALON_PUBLIC_URL accepte IPv6, mais rien n'écoute en IPv6"
gravite = "faible"
lieux = [
  "salon/crates/host/src/http.rs:72",
  "salon/crates/host/src/http.rs:74",
  "salon/crates/host/src/address.rs:104",
]
cas = "`http://[fe80::1]:8090` passe le test `a_base_keeps_what_phones_need`, et l'hôte annonce un candidat IPv6, mais TCP et UDP sont liés à 0.0.0.0 : le QR mène nulle part, sans message. Un réseau IPv6 seul n'a aucun chemin vers l'hôte."
preuve = "Sonde taddr avec `SALON_PUBLIC_URL=http://[::1]:port` : candidats [::1] et 127.0.0.1, `curl http://[::1]:port/` refusé, 127.0.0.1 répond 200. Avec le seul écouteur TCP lié à `::`, `[::1]` répond 200 et la page ouvre WebRTC par la boucle en 353 ms."
verifie = "Le refus et le correctif TCP, sur ce Mac."
suppose = "Qu'un hôte réel soit en IPv6 seul. Fermé par un refus clair, pas par IPv6 : un tel réseau reste sans chemin vers l'hôte. L'UDP lié à `::` n'est pas éprouvé : il ferait voir des sources mappées à rtc.rs:231 et exigerait de convertir les destinations."

[[trou]]
id = "T9"
titre = "Safari iOS sur un vrai Wi-Fi de soirée n'a jamais été mesuré"
gravite = "moyenne"
lieux = [
  "salon/LEARNINGS.md:90",
  "salon/crates/host/src/rtc.rs:63",
  "REPETITION.md:30",
]
cas = "La seule mesure sur iPhone date du 27/10/2026, Mac en partage de connexion. Trois choses n'ont jamais été vues sur l'appareil : un Wi-Fi sans internet avec le cellulaire actif, où Safari peut ne pas partir par l'interface de l'hôte (RFC 8828, mode 2, et Network.framework) alors que LEARNINGS conseille justement un routeur dédié ; le candidat 127.0.0.1 ; la perte et la gigue d'une vraie borne. Le premier cas mènerait à T2 pour chaque iPhone."
preuve = "Aucune sonde : il faut un vrai iPhone. WebKit 27.2 de Playwright sur macOS ouvre le canal et passe les 98 pannes unitaires, mais ce n'est pas Safari iOS."
verifie = "Le texte de la RFC 8828, le chemin Network.framework de WebKit au commit figé, et l'absence de ces cas dans REPETITION.md."
suppose = "Tout le comportement réel : ce trou reste supposé. À mesurer pendant la répétition : iPhone sur un Wi-Fi sans internet, données cellulaires actives, relever le transport dit par SALON_LOG=1."

[[trou]]
id = "T10"
titre = "Aucun test ne joue une panne pendant la poignée de main, ni un pair qui forge"
gravite = "faible"
lieux = [
  "salon/crates/crypto/tests/handshake.rs:1",
  "tools/cert/rtc-negotiation.mjs:10",
  "salon/fuzz/fuzz_targets/session.rs:1",
]
cas = "handshake.rs fait parler deux str0m sur un réseau parfait. Le harnais rtc retarde la réponse, ment sur le SDP et coupe tout, mais ne perd jamais un seul datagramme de la poignée de main, et le fuzz de salon ne touche ni l'offre ni UDP. Le bon comportement constaté aujourd'hui ne tient qu'aux versions figées, et une montée de str0m ou de dimpl ne serait pas éprouvée. Chromium 151 envoie un ClientHello fragmenté sur deux datagrammes, que rien ne fixe."
preuve = "Sonde panne : 98 pannes unitaires, chaque datagramme de la poignée de main perdu puis doublé, dans chaque sens, sur Chromium 151 et WebKit 27.2 : canal ouvert à chaque fois, 1,3 s au pire, ni repli ni panique. `cargo test -p salon-crypto` reste vert avec T1 ouvert, et le pair de la sonde rougit à la première attaque : retirer l'assertion le fait passer."
verifie = "Le contenu des suites et le résultat des 98 pannes à ces versions."
suppose = "Firefox n'a pas été éprouvé : la version de Playwright installée n'a pas ouvert de canal par le relais, sans que la cause soit établie. La suite garde deux str0m, pas un navigateur : elle refait voir un changement de version, elle ne dit pas ce que Chromium ou WebKit enverront ensuite. Elle n'avait rien à faire rougir sur ces versions, sauf le doublon d'époque 1 : ses cas fixent un comportement sain et un contrôle négatif prouve qu'elle sait échouer."

[[trou]]
id = "T11"
titre = "dimpl 0.7.6 reste en place tant que str0m n'a rien publié au-dessus"
gravite = "moyenne"
lieux = [
  "salon/crates/crypto/Cargo.toml:23",
]
cas = "T1 est fermé par l'isolation : dimpl 0.7.6 panique toujours, et rien ne corrige #191, où un enregistrement non authentifié mis en file avant le chiffrement peut être livré comme donnée, ni #192 et #194 à #197. Un attaquant du Wi-Fi qui usurpe la source d'une page en poignée de main peut lui coûter son lien, et rien de plus. La dernière version publiée de str0m, 0.24.1, demande dimpl ^0.7.4, et dimpl ne publie pas de 0.7.7 : dimpl 0.9.0 n'entre que par le commit f7bc4a6 de str0m, non publié. Salon ne peut pas forcer une version : str0m-proto 0.7.0 est compilé contre dimpl 0.7, et un `[patch]` dans salon ne s'applique pas aux jeux."
preuve = "crates.io le 02/11/2026 : str0m 0.24.1 du 03/10, dépendance dimpl ^0.7.4 ; dimpl 0.9.0 du 25/10. CHANGELOG de str0m : « Bump dimpl to 0.9.0 » est sous Unreleased. Essai sur une copie de salon avec str0m f7bc4a6 par `git` et dimpl 0.9.0 : trois erreurs de compilation, toutes dans salon-crypto (`send_application_data` rend usize, `CryptoProvider` veut `sha1_provider`), une dizaine de lignes ; 32 paquets de plus dans Cargo.lock (206 contre 174, dont une seconde pile RustCrypto) ; `cargo test -p salon-crypto -p salon-host` vert, sans toucher salon-host. Le test `dimpl_on_a_doubled_early_encrypted_record` fixe la panique : il rougit le jour où elle disparaît."
verifie = "Les versions publiées, le coût de compilation et les tests de salon sur la copie."
suppose = "Que str0m publie bientôt : rien ne le dit. Une dépendance `git` sur 46 commits non publiés, dont des changements cassants de str0m hors du canal de données, n'a pas été éprouvée sur navigateur. Ce choix revient à l'hôte. #192 et #194 à #197 ne sont pas éprouvés ici."

[saturation]
sources = ["pion-webrtc", "node-datachannel", "adapter"]
derniere_lecon = "dimpl-tests"
note = "Quota atteint avant la fin de la lecture du code client. Les trois dernières lectures couvrent un serveur full ICE, une liaison Node et le code client qui contourne les navigateurs : aucune ne nomme un défaut que salon n'aurait pas déjà dans une leçon ou un trou."

[saturation.recoupe]
pion-webrtc = "SetNAT1To1IPs et SetInterfaceFilter redisent T3 ; SetICETimeouts redit que `disconnected` précède `failed` ; SetLite n'ajoute rien à la RFC 8445. Son mDNS concerne un serveur qui publie ses candidats, pas salon."
node-datachannel = "bindAddress et l'option mtu redisent T3 et T4 au-dessus de libdatachannel ; maxMessageSize redit geckos."
adapter = "Ses cales Safari et Chrome portent sur maxMessageSize, createOffer et extmap : 1 100 octets sont sous la limite de 262 144 mesurée sur les deux moteurs, et salon ne passe pas par ces chemins."

[cout]
minutes = 55
references = 23
sondes_executees = 34
note = "Temps réel d'une session d'agent, lecture, sondes et rédaction. Les 98 pannes unitaires et les scénarios UDP muet tournent en temps réel, 15 s par cas. Le pare-feu de ce Mac coupe l'adresse réseau : tout passe par la boucle locale et un relais UDP."
