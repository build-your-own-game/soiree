chemins = ["tools/cert/**", "outil/src/verification/**", "outil/verification-kernel/**", "certifications/**"]

# Les jeux. Le plancher d'un jeu reste bas : la dette ne bloque que le commun.

[[sous_systeme]]
id = "rendu"
perimetre = "jeu"
niveau = 2
marches = ["chez-nous", "reel", "normes"]
chemins = ["crates/screen/**", "crates/*/src/**/render*", "crates/*/src/**/scene*"]

[[sous_systeme]]
id = "physique"
perimetre = "jeu"
niveau = 2
marches = ["chez-nous", "reel", "bancs"]
