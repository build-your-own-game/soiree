[[trou]]
id = "T1"
titre = "Les traits envoyés pendant une coupure disparaissent, et le trait ne finit jamais"
gravite = "haute"
lieux = [
  "remote/ios/Remote/GameConnection.swift:140",
  "remote/ios/Remote/GameConnection.swift:143",
]
cas = "flush vide session.drain() avant de regarder le socket. Pendant le repli de 0,5 à 5 s, socket vaut nil : les trames sont jetées. Dessin en cours, hôte qui coupe : l'hôte reçoit Begin et 19 points, puis plus rien, ni le reste ni End, alors que release_all a bien produit End. Le jeu garde un trait ouvert pour toujours. CONTRAT.md dit que le WebSocket les livre tous. Les envois partis sans accusé juste avant la coupure sont perdus aussi, send ignore son erreur."
preuve = "sonde H1, app réelle dans le simulateur, hôte de sonde qui coupe après 20 trames : témoin sans coupure Begin + 19 points + End ; avec coupure pas de End ; en gardant les trames jusqu'au socket suivant, Hello d'abord, End arrive 0,5 s plus tard, à la reconnexion. Seul flush a changé."
verifie = "le chemin complet dans l'app sur simulateur iOS 26.5, sur boucle locale"
suppose = "La fréquence sur un vrai Wi-Fi. Reste ouvert ce que le correctif ne peut pas voir : une trame déjà remise au noyau quand le lien meurt est perdue sans erreur. Y compris un End, jusqu'à la détection de T2. Il faudrait un numéro de trait accusé par l'hôte, à trancher : un Pong n'y suffit pas, renvoyer Undo ou Clear le rejouerait."

[[trou]]
id = "T2"
titre = "L'app ne voit pas un hôte devenu muet"
gravite = "haute"
lieux = [
  "remote/ios/Remote/GameConnection.swift:80",
  "remote/ios/Remote/GameConnection.swift:75",
]
cas = "Aucun sendPing, aucune échéance : seule une erreur de receive dit que le lien est mort. Sur un pad, l'hôte n'envoie rien tant que rien ne change, et sur une page l'app se tait aussi. Hôte figé 25 s : l'app affiche le pad, sans mot, sans reconnexion, et ne saurait pas distinguer ce silence d'une partie calme. Le joueur appuie dans le vide."
preuve = "sonde H2 : SIGSTOP de l'hôte 25 s, aucune erreur ni reconnexion, 98 états périmés livrés au dégel. Avec sendPing toutes les 2 s et coupure sans pong, seule variante, reconnexion moins de 4 s après le gel et retour dès le dégel."
verifie = "l'app sur simulateur, hôte figé au niveau du processus : le noyau accuse encore réception"
suppose = "Le réglage de 2 s sur un Wi-Fi réel : un trou de plus de 2 s coupe un lien vivant, ce qui coûte un Left et un Back. Le Pong de salon est revérifié par le banc, en boucle locale, page muette et processus figé."

[[trou]]
id = "T3"
titre = "Un chargement raté laisse un écran vide pour toujours"
gravite = "haute"
lieux = [
  "remote/ios/Remote/WebRemote.swift:45",
  "remote/ios/Remote/GameScreen.swift:60",
]
cas = "Aucun didFailProvisionalNavigation. /remote a répondu, status vaut connected, donc aucune notice ; la page du jeu ne vient pas et rien ne réessaie. C'est le chemin par défaut de tous les jeux. Le joueur voit un fond vide et la croix."
preuve = "sonde H8 : hôte qui coupe les premières requêtes de la page, WebKit essaie 4 fois en quelques ms, code -1005, 0 chargement réussi en 15 s. Avec un nouvel essai après 1 s dans didFailProvisionalNavigation, seule variante, la page se charge."
verifie = "l'app sur simulateur, échec provoqué côté hôte"
suppose = "À quelle fréquence un vrai Wi-Fi coupe à cet instant. Une seule coupure est rejouée par la pile réseau : il en a fallu plusieurs."

[[trou]]
id = "T4"
titre = "Le processus de la page meurt deux fois : écran vide sans mot"
gravite = "moyenne"
lieux = [
  "remote/ios/Remote/WebRemote.swift:63",
  "remote/ios/Remote/WebRemote.swift:140",
]
cas = "Aucun webViewWebContentProcessDidTerminate. WebKit recharge seul une fois par fenêtre de 30 s : une page lourde qui replante reste vide, status connected, sans notice. Bridge garde motion et sockets d'une page morte, donc une page rechargée trouve ses 8 sockets pris."
preuve = "sonde H7 : kill du processus WebContent dans le simulateur. Une fois : rechargé. Deux fois de suite : plus aucun chargement en 17 s, capture vide. Avec webView.reload() dans le rappel, seule variante, 3 morts donnent 3 chargements."
verifie = "l'app sur simulateur ; la constante et le chemin de code de WebKit au commit figé"
suppose = "Ce que fait iOS à un WASM lourd sur un vrai iPhone, et si la mort en arrière-plan suit ce chemin. Le banc tue le processus par le crochet de test de WebKit, pas par la mémoire : ce crochet ne recharge jamais seul, ce qui rend le test plus dur que la sonde."

[[trou]]
id = "T5"
titre = "Réseau local refusé : aucun message, l'erreur est jetée"
gravite = "haute"
lieux = [
