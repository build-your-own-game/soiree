[cout]
minutes = 46
references = 28
sondes_executees = 35
note = "Temps horloge d'un agent, 13 builds Xcode et rédaction compris. 9 dépôts clonés en filtré, le reste lu par raw.githubusercontent et gh api. Réfutées, sans trou : H5 (bouton tenu en changeant d'app, le relâchement part), H9 (updateUIView ne recharge pas la page), H19 (Nagle déjà coupé), H21 (scanner présent avant autorisation), H23 (retour au premier plan). Non essayées : H24 et le bouton latéral de verrouillage. La FAQ Local Network des forums Apple est derrière une vérification de navigateur : lue nulle part, non citée. Un commit local de Sidequest portant la même leçon que telecommande-44 n'est pas publié : REPETITION.md est cité à sa place."
