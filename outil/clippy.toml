# Écrit par `soiree new` et `soiree upgrade`, vérifié par `soiree check`.
# Tu peux durcir une règle. Pour en assouplir une : #[expect(lint, reason = "…")] à l'endroit précis.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# Un `bool` en paramètre s'inverse sans que le compilateur le voie : une enum à deux variants, ou deux méthodes.
max-fn-params-bools = 0

disallowed-types = [
  { path = "std::collections::HashMap", reason = "ordre d'itération aléatoire : utilise BTreeMap ou un hasher à graine fixe" },
  { path = "std::collections::HashSet", reason = "ordre d'itération aléatoire : utilise BTreeSet ou un hasher à graine fixe" },
]
