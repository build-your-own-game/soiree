[package]
name = "verification-kernel"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "The finite, formally checked decision kernel used by soiree verification"

# Keep formal verification isolated from the CLI and from every game's workspace.
[workspace]

[dependencies]
vstd = { version = "=0.0.0-2026-10-25-0158", default-features = false }

[package.metadata.verus]
verify = true

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_keep_ghost)", "cfg(verus_keep_ghost_body)", "cfg(verus_verify_core)"] }

[lints.clippy]
all = "deny"
pedantic = "deny"

