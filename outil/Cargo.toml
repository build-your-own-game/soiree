# L'outil `soiree`. Il embarque les règles (`regles/`) et le jeu de départ
# (`modele/`) de sa version. Il s'installe depuis un clone avec :
#   cargo install --locked --path outil
[package]
name = "soiree"
description = "L'outil de la console : vérifier un jeu, lui donner les règles, en créer un."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# Rejoue la machine d'un jeu en WebAssembly, sans rien installer à côté.
wasmi = { version = "2", default-features = false, features = ["std", "stable", "validate", "auto-dispatch"] }

[lints]
workspace = true
