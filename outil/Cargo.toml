# L'outil `soiree`. Il embarque les règles (`regles/`) et le jeu de départ
# (`modele/`) de sa version. Il s'installe depuis un clone avec :
#   cargo install --locked --path outil
[package]
name = "soiree"
description = "L'outil de la console : vérifier un jeu, lui donner les règles, en créer un."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# Le passage par internet : l'étagère rejoint le relais de l'hôte, en HTTPS,
# et lui amène les téléphones (`src/internet.rs`).
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
webpki-roots = "1"
# Le guichet : l'étagère fait suivre au relais la question d'un jeu dont la
# console n'a pas le secret (`src/internet.rs`, `Passage::counter`).
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Le banc du réseau (`src/network.rs`) : un téléphone d'essai ouvre le lien
# d'une page avec le jeu, à travers un tuyau abîmé exprès.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Rejoue la machine d'un jeu en WebAssembly, sans rien installer à côté.
wasmi = { version = "2", default-features = false, features = ["std", "stable", "validate", "auto-dispatch"] }

[lints]
workspace = true
