# Le [patch] local de l'hôte : à copier dans `.cargo/config.toml`, à la racine
# du dossier qui contient `soiree/` et `games/`. Ce fichier n'est dans aucun
# dépôt. Voir AGENTS.md, à côté de `.cargo/`.
#
# Décommenté, il remplace, pour tout projet placé sous ce dossier, la brique
# empruntée à une étiquette de la console par le dossier local : c'est ce qui
# permet de changer la console et un jeu en même temps. Remets-le en
# commentaire avant de vérifier et de committer un jeu.

# [patch."https://github.com/build-your-own-game/soiree"]
# telecommande = { path = "soiree/telecommande" }
