[workspace]
resolver = "3"
# TODO(modele) : le code du jeu de départ n'existe pas encore. Il viendra de la
# démo de salon : crates/core (la simulation, sans navigateur), crates/host (le
# serveur, salon-host) et crates/web (la TV et le téléphone, salon-web).
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"
publish = false

[workspace.dependencies]
# Salon, la couche réseau commune (.soiree/salon/README.md), à la version de
# soiree.toml. `soiree upgrade` change l'étiquette ; chez l'hôte, le [patch] de
# son dossier la remplace par sa copie locale.
salon-core = { git = "https://github.com/{{org}}/soiree", tag = "v{{version}}" }
salon-host = { git = "https://github.com/{{org}}/soiree", tag = "v{{version}}" }
salon-web = { git = "https://github.com/{{org}}/soiree", tag = "v{{version}}" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
# Doit être exactement la version du wasm-bindgen-cli installé (`soiree doctor`).
wasm-bindgen = "=0.2.129"
web-sys = "0.3"
# Tests de propriétés (CERTIFICATION.md, étage 1). Sans les fonctions `fork` et
# `timeout` par défaut : les cas tournent dans le processus, et un échec se
# réduit vite.
proptest = { version = "1", default-features = false, features = ["std"] }

# Les lints et les profils qui suivent sont les règles communes : `soiree check`
# les vérifie. Tu peux en durcir ; pour en assouplir une, il faut
# #[expect(lint, reason = "…")] à l'endroit précis, jamais #[allow].
# Chaque crate du workspace les reprend avec `[lints] workspace = true`.

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Du bruit dans du code de jeu : conversions entier → flottant partout, documentation d'API publique inutile ici.
cast_precision_loss = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Chaque exception est explicite et justifiée : #[expect(lint, reason = "...")], jamais #[allow].
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Un `.expect()`, un `panic!` ou un index hors bornes arrêtent la partie autant qu'un `unwrap`.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
todo = "deny"

# Un jeu compilé en debug sans optimisation est injouable : on optimise les dépendances même en dev.
[profile.dev.package."*"]
opt-level = 3

# Un dépassement d'entier est un bug, même en release.
[profile.release]
overflow-checks = true
