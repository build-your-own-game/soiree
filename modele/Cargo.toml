[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"
publish = false

[workspace.dependencies]
# Salon, la couche réseau commune (.soiree/salon/README.md), à la version de
# soiree.toml. `soiree upgrade` change l'étiquette ; chez l'hôte, le [patch] de
# son dossier la remplace par sa copie locale.
salon-core = { git = "https://github.com/build-your-own-game/soiree", tag = "v{{version}}" }
salon-host = { git = "https://github.com/build-your-own-game/soiree", tag = "v{{version}}" }
salon-web = { git = "https://github.com/build-your-own-game/soiree", tag = "v{{version}}" }
game-core = { package = "{{nom}}-core", path = "crates/core" }
serde = { version = "1", features = ["derive"] }
# Doit être exactement la version du wasm-bindgen-cli installé (`soiree doctor`).
wasm-bindgen = "=0.2.129"
web-sys = "0.3"
# Tests de propriétés (CERTIFICATION.md, étage 1). Sans les fonctions `fork` et
# `timeout` par défaut : les cas tournent dans le processus, et un échec se
# réduit vite.
proptest = { version = "1", default-features = false, features = ["std"] }

# Les lints et les profils qui suivent sont les règles communes : `soiree check`
# les vérifie. Tu peux en durcir ; pour en assouplir une, il faut
# #[expect(lint, reason = "…")] à l'endroit précis, jamais #[allow].
# Chaque crate du workspace les reprend avec `[lints] workspace = true`.

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Du bruit dans du code de jeu : documentation d'API publique inutile ici.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Chaque exception est explicite et justifiée : #[expect(lint, reason = "...")], jamais #[allow].
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Un `.expect()`, un `panic!` ou un index hors bornes arrêtent la partie autant qu'un `unwrap`.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
todo = "deny"
# Un `_ =>` sur une enum avale en silence le variant qu'on ajoutera demain : nomme ceux qu'on ignore.
wildcard_enum_match_arm = "deny"
# Un `bool` en paramètre s'inverse sans que le compilateur le voie : une enum, ou deux méthodes (avec max-fn-params-bools = 0 dans clippy.toml).
fn_params_excessive_bools = "deny"
# Un entier converti en flottant peut perdre des chiffres : `f64::from`, ou une seule fonction qui dit pourquoi la perte est sans effet.
cast_precision_loss = "deny"
# Un dépassement d'entier arrête la partie (overflow-checks) : checked_, saturating_ ou wrapping_, choisi exprès.
# Le code de rendu et les tests peuvent s'en exempter par un #![expect(..., reason = "…")] en tête de crate ou de module.
arithmetic_side_effects = "deny"
# Une valeur qu'on jette dit son type (`let _: T = …`), et `.ok()` ne sert pas à faire taire un Result.
let_underscore_untyped = "deny"
unused_result_ok = "deny"

# Un jeu compilé en debug sans optimisation est injouable : on optimise les dépendances même en dev.
[profile.dev.package."*"]
opt-level = 3

# Un dépassement d'entier est un bug, même en release.
[profile.release]
overflow-checks = true
