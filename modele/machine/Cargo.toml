# La machine : les règles du jeu, et rien d'autre. Elle remplit le contrat de
# la console (`soiree contrat`) : on lui donne une graine et des entrées, elle
# rend la partie, la même à chaque fois, sur l'ordinateur comme dans un
# navigateur. `soiree check` le vérifie : la machine se compile sans système,
# et le banc (`examples/banc.rs`) joue des parties avec elle.
[package]
name = "machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.soiree]
machine = true

[dependencies]
cartouche.workspace = true
messages.workspace = true
serde.workspace = true

# Le banc de la console, pour l'exemple `banc` seulement : il demande le système.
[dev-dependencies]
cartouche = { workspace = true, features = ["bench"] }

[lints]
workspace = true
