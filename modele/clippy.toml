# Les réglages de Clippy de la console.
# Copié par `soiree rules`, vérifié par `soiree check`.

# Dans un test, un `unwrap` qui échoue fait échouer le test : c'est ce qu'on veut.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# Un `bool` en paramètre s'inverse sans que le compilateur le voie : une enum à deux variants, ou deux fonctions.
max-fn-params-bools = 0

# Ces appels arrêtent la partie quand un rang est faux, et `indexing_slicing` ne les voit pas.
# Clippy n'a pas de réglage pour les permettre dans les tests : là aussi, écris autrement.
disallowed-methods = [
  { path = "alloc::vec::Vec::remove", reason = "s'arrête si le rang est hors de la liste : `retain` pour retirer par ce qu'est l'élément, ou une `VecDeque`, dont `remove` rend une `Option`" },
  { path = "alloc::vec::Vec::swap_remove", reason = "s'arrête si le rang est hors de la liste : `retain` pour retirer par ce qu'est l'élément, ou une `VecDeque`, dont `swap_remove_back` rend une `Option`" },
  { path = "alloc::vec::Vec::insert", reason = "s'arrête si le rang dépasse la longueur : `push` (puis un tri si l'ordre compte), ou une `BTreeMap` rangée par sa clé" },
  { path = "alloc::vec::Vec::split_off", reason = "s'arrête si le rang dépasse la longueur : `split_at_checked`, ou `truncate`" },
  { path = "slice::swap", reason = "s'arrête si un rang est hors de la liste : `get_disjoint_mut([i, j])` puis `core::mem::swap`, ou un filtrage `[a, b, ..]`" },
  { path = "slice::split_at", reason = "s'arrête si le rang dépasse la longueur : `split_at_checked`, qui rend une `Option`" },
  { path = "slice::split_at_mut", reason = "s'arrête si le rang dépasse la longueur : `split_at_mut_checked`, qui rend une `Option`" },
  { path = "slice::copy_from_slice", reason = "s'arrête si les longueurs diffèrent : `for (a, b) in dest.iter_mut().zip(source)`" },
  { path = "slice::clone_from_slice", reason = "s'arrête si les longueurs diffèrent : `for (a, b) in dest.iter_mut().zip(source)`" },
  { path = "alloc::string::String::remove", reason = "s'arrête hors du texte ou au milieu d'un caractère : `pop`, `retain`, ou un nouveau texte fait de `chars()`" },
  { path = "alloc::string::String::insert", reason = "s'arrête hors du texte ou au milieu d'un caractère : `push`, ou un nouveau texte (`format!`)" },
  { path = "alloc::string::String::insert_str", reason = "s'arrête hors du texte ou au milieu d'un caractère : `push_str`, ou un nouveau texte (`format!`)" },
]

# Additionner deux vecteurs de `glam` ne déborde pas : ce sont des flottants. Sans cette ligne,
# `arithmetic_side_effects` les refuserait à tort. Les entiers restent surveillés.
arithmetic-side-effects-allowed = [
  "glam::Vec2", "glam::Vec3", "glam::Vec3A", "glam::Vec4", "glam::Quat",
  "glam::Mat2", "glam::Mat3", "glam::Mat3A", "glam::Mat4", "glam::Affine2", "glam::Affine3A",
  "glam::DVec2", "glam::DVec3", "glam::DVec4", "glam::DQuat",
  "glam::DMat2", "glam::DMat3", "glam::DMat4", "glam::DAffine2", "glam::DAffine3",
]
