# La version de Rust de la console, la même pour tous les jeux.
# Copié par `soiree rules`, vérifié par `soiree check`.
[toolchain]
channel = "1.99"
components = ["rustfmt", "clippy"]
# `wasm32-unknown-unknown` pour les pages. Pour la machine : `wasm32v1-none`, une cible sans
# système, et `wasm32-wasip1`, pour la rejouer en WebAssembly.
targets = ["wasm32-unknown-unknown", "wasm32v1-none", "wasm32-wasip1"]
